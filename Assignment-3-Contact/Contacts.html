<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>

<body>


    <h1>Contact Form</h1>

    <form action="confirmation.php" method="POST">

        <label for="firstname">First Name:</label><br>
        <input type="text" id="firstname" name="fname" required><br><br>

        <label for="lastname">Last Name:</label><br>
        <input type="text" id="lastname" name="lname" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phoneNumber"><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="reason">Reason for contacting:</label><br>
        <select id="reason" name="reason" required>
            <option value="">Select One</option>
            <option value="Question">Question</option>
            <option value="Feedback">Feedback</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label>Preferred contact method:</label><br>
        <input type="radio" id="email-pref" name="preferredMethod" value="Email" checked>
        <label for="email-pref">Email</label>
        <input type="radio" id="phone-pref" name="preferredMethod" value="Phone">
        <label for="phone-pref">Phone</label><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>


</body>

</html>
